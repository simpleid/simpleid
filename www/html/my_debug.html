<div class="debug-auth info-pane" x-data="{ expanded: false }">
  <button class="debug-auth--heading info-pane--heading" @click.prevent="expanded = !expanded">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-down"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <span>{{ @intl.core.my.debug_auth_title }}</span>
  </button>
  <div class="debug-auth--details info-pane--details narrative" x-show="expanded" x-collapse>
    {{ @debug_vars.auth | raw }}
  </div>
</div>

<div class="debug-user info-pane" x-data="{ expanded: false }">
  <button class="debug-user--heading info-pane--heading" @click.prevent="expanded = !expanded">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-down"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <span>{{ @intl.core.my.debug_user_title }}</span>
  </button>
  <div class="debug-user--details info-pane--details narrative" x-show="expanded" x-collapse>
    {{ @debug_vars.user | raw }}
  </div>
</div>
