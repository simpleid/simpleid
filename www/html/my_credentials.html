<script type="text/javascript">
    document.addEventListener('alpine:init', () => {
        Alpine.data('myCredentialsApp', (basePath, tk) => ({
            addMenu: [],
            credentials: [],
            message: '',
            isLoading: true,
            showAddMenu: false,
            postAction: '',
            postParams: {},
            basePath: basePath.endsWith('/') ? basePath : basePath + '/',
            tk: tk,

            init() {
                this.refresh()
            },

            refresh() {
                fetch(this.basePath + 'my/credentials', {
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-Request-Token': this.tk,
                        'Accept': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(response => {
                    this.addMenu = response.addMenu;
                    // TODO preprocess response.credentials into table rows.
                    this.credentials = response.credentials;
                    this.isLoading = false;
                });
            },

            formatDescription(description, firstTime, lastTime) {
                if (description) return description;
                return {{ @intl.core.auth_webauthn.first_time_label | js, raw }}
                    + ' ' + (new Date(firstTime * 1000)).toLocaleDateString()
                    + ' | ' + {{ @intl.core.auth_webauthn.last_time_label | js, raw }}
                    + ' ' + (new Date(lastTime * 1000)).toLocaleDateString();
            },

            doAction(action) {
                if (action.confirm || false) {
                    if (!confirm(action.confirm)) return;
                }

                if (action.type == 'link') {

                } else if (action.type == 'form') {
                    this.postAction = action.url;
                    this.postParams = action?.params || {};
                    this.$nextTick(() => this.$refs.postActionForm.requestSubmit());
                } else if (action.type == 'ajax') {
                    // TODO - the logic of this should be
                    // if params.headers is undefined, set params.headers to below.
                    // if params.headers is defined, merge params.headers with below.
                    params.headers = {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-Request-Token': this.tk,
                        'Accept': 'application/json'
                    };

                    fetch(this.basePath + action.url, params)
                    .then(response => {
                      const body = response.json();
                      if (response.ok) {
                          this.message = body.result_description;
                          this.refresh();
                      } else {
                          this.message = body.error_description;
                      }
                  })
                }
            }
        }));
    });
</script>

<div x-data="myCredentialsApp({{ @base_path | js, raw }}, {{ @my_credentials_tk | js, raw }})">
    <div class="message" x-cloak x-show="message"><p x-html="message"></p></div>

    <div class="form-item" x-show="addMenu.length > 0">
        <button type="button" @click.prevent="showAddMenu = !showAddMenu" x-ref="addButton">
            {{ @intl.common.add }}
        </button>
        <ul id="my-credentials-add" role="menu" class="form-popup-menu" x-show="showAddMenu" x-anchor.bottom-start.offset.5="$refs.addButton">
            <template x-for="(item, idx) in addMenu">
                <li><a @click.prevent="doAction(item.action)" x-text="item.title"></a></li>
            </template>
        </ul>
    </div>

    <table id="my-credentials" class="table-list">
        <tr class="table-list--loading" x-show="isLoading">
            <td colspan="2" style="text-align: center"><div class="loading-spinner"></div></td>
        </tr>
        <tr class="table-list--none" x-cloak x-show="!isLoading && (credentials.length == 0)">
            <td colspan="2" style="text-align: center">{{ @intl.core.my.credential_none | markdown, raw }}</td>
        </tr>
        <template x-for="(scheme, idx) in credentials" :key="scheme.id">
            <tr class="table-list-item" :class="{ 'u-first': (idx == 0) }">
                <td class="table-list-item--main">
                    <div class="table-list-item--heading"><strong x-text="scheme.title"></strong></div>
                    <div class="table-list-item--body" x-data="{ expanded: false }">
                        <div>
                            <span x-text="(scheme.credentials.length == 1) ? {{ @intl.core.my.credential_one_label | js, raw }} : $format({{ @intl.core.my.credential_more_label | js, raw }}, { length: scheme.credentials.length })"></span>
                            <button class="" x-show="scheme.allow_multiple" @click.prevent="expanded = !expanded">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-down"><polyline points="6 9 12 15 18 9"></polyline></svg>
                            </button>
                        </div>
                        <table class="table-list" x-show="(scheme.credentials.length > 1) && expanded">
                            <template x-for="(credential, idx) in scheme.credentials" :key="credential.id">
                                <tr class="table-list-item" :class="{ 'u-first': (idx == 0) }">
                                    <td class="table-list-item--main">
                                        <div class="table-list-item--heading"><span x-text="credential.title"></span> <span class="badge" :class="'badge--credential-' + credential?.subtype.replace(' ', '-')" x-text="credential?.subtype" x-show="credential?.subtype"></span></div></div>
                                        <div class="table-list-item--body table-list-item--description" x-show="formatDescription(credential?.description, credential?.first_time, credential?.last_time)" x-text="formatDescription(credential?.description, credential?.first_time, credential?.last_time)"></div>
                                    </td>
                                    <td class="table-list-item--actions">
                                        <template x-if="credential?.actions?.length ?? 0">
                                            <template x-for="(action, idx) in (credential?.actions)">
                                                <button class="is-subtle" :class="action?.class" x-text="action.title" @click.prevent="doAction(action)"></button>
                                            </template>
                                        </template>
                                    </td>
                                </tr>
                            </template>
                        </table>
                    </div>
                </td>
                <td class="table-list-item--actions">
                    <template x-if="(!scheme.allow_multiple) && (scheme.credentials[0]?.actions?.length ?? 0)">
                        <template x-for="(action, idx) in (scheme.credentials[0]?.actions)">
                            <button class="is-subtle" :class="action?.class" x-text="action.title" @click.prevent="doAction(action)"></button>
                        </template>
                    </template>
                </td>
            </tr>
        </template>
    </table>

    <form method="post" class="u-hidden" x-ref="postActionForm" x-bind:action="basePath + postAction">
        <input type="hidden" name="tk" x-bind:value="tk">
        <template x-for="(value, name) in postParams">
            <input type="hidden" x-bind:name="name" x-bind:value="value">
        </template>
    </form>
</div>
